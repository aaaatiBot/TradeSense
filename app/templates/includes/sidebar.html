{# Sidenav Include (Soft UI Sidebar Design Pattern) #}
<aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 border-radius-xl my-3 fixed-start ms-3" id="sidenav-main">
  <div class="sidenav-header d-flex align-items-center">
    <a class="navbar-brand m-0 d-flex align-items-center" href="/dashboard">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" class="navbar-brand-img h-100" alt="TradeSense Logo" style="max-height: 38px;">
    </a>
  </div>
  <hr class="horizontal dark mt-0 mb-2">
  <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">
    <ul class="navbar-nav list-unstyled px-2">
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-speedometer2"></i>
          </div>
          <span class="nav-link-text ms-1">Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/recommendation' %}active{% endif %}" href="/recommendation">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-lightning-charge"></i>
          </div>
          <span class="nav-link-text ms-1">Recommendations</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/history' %}active{% endif %}" href="/history">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-clock-history"></i>
          </div>
          <span class="nav-link-text ms-1">Trade History</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/verification' %}active{% endif %}" href="/verification">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-shield-check"></i>
          </div>
          <span class="nav-link-text ms-1">Verification</span>
        </a>
      </li>

      <li class="nav-item mt-3">
        <h6 class="ps-3 ms-2 text-uppercase text-xs font-weight-bolder text-muted">Admin & System</h6>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/api/v1/health" target="_blank">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-heart-pulse"></i>
          </div>
          <span class="nav-link-text ms-1">System Health</span>
        </a>
      </li>

      <li class="nav-item mt-3">
        <h6 class="ps-3 ms-2 text-uppercase text-xs font-weight-bolder text-muted">Account</h6>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/login' %}active{% endif %}" href="/login">
          <div class="icon-shape icon-sm shadow-sm border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
            <i class="bi bi-person"></i>
          </div>
          <span class="nav-link-text ms-1">Sign In / Profile</span>
        </a>
      </li>
    </ul>
  </div>
  <div class="sidenav-footer mx-3 mt-auto mb-3">
    <div class="card card-background shadow-none border-radius-md bg-light p-2 text-center">
      <span class="text-xs font-weight-bold text-secondary">SEBI RA Mock Edition</span>
      <span class="text-xxs text-muted">SRS v3.1 Compliant</span>
    </div>
  </div>
</aside>
